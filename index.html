<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segumafra - Control USB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; }
        
        #logo-container { margin-bottom: 15px; }
        #logo-container img { max-width: 180px; margin-bottom: 10px; }
        #welcome-text { font-size: 1.6em; font-weight: bold; color: #0056b3; margin-bottom: 2px; }
        #cliente-info { font-size: 0.9em; color: #444; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-top: 5px; }
        #modo-info { display: inline-block; background: #e9ecef; color: #333; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-top: 8px; letter-spacing: 0.5px; }
        
        .btn { display: inline-block; width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: #0056b3; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        
        #status-text { font-weight: 600; font-size: 1.1em; margin: 15px 0; color: #333; min-height: 24px; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; display: none; }
        .keypad button { padding: 15px; font-size: 22px; font-weight: bold; border-radius: 8px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; color: #333;}
        
        #terminal { background: #1e1e1e; color: #00ff00; padding: 12px; height: 120px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 11px; margin-top: 25px; border-radius: 8px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div id="logo-container">
        <img id="client-logo" src="logo_segumafra.png" alt="Segumafra Logo">
        <div id="welcome-text">¡Bienvenido!</div>
        <div id="cliente-info">Sistemas de Alta Tecnología</div>
        <div id="modo-info" style="display:none;">MODO: --</div>
    </div>

    <button id="btn-connect" class="btn btn-blue">🔌 Conectar Dispositivo USB</button>

    <div id="status-text" style="display:none;">Sincronizando...</div>

    <div id="controls" style="display:none;">
        <button id="btn-abrir" class="btn btn-green">ACCIONAR APERTURA</button>
        <button id="btn-cerrar" class="btn btn-red">ACCIONAR CIERRE</button>
    </div>

    <div id="keypad-container" class="keypad">
        <button class="key" data-val="1">1</button>
        <button class="key" data-val="2">2</button>
        <button class="key" data-val="3">3</button>
        <button class="key" data-val="4">4</button>
        <button class="key" data-val="5">5</button>
        <button class="key" data-val="6">6</button>
        <button class="key" data-val="7">7</button>
        <button class="key" data-val="8">8</button>
        <button class="key" data-val="9">9</button>
        <button class="key" style="background:#ffe6e6; color:#d32f2f;" id="btn-borrar">C</button>
        <button class="key" data-val="0">0</button>
        <button class="key" style="background:#e6ffe6; color:#2e7d32;" id="btn-enviar">OK</button>
    </div>

    <!-- Ahora la consola mostrará todo el tráfico en bruto -->
    <div id="terminal"></div>
</div>

<script>
    let port;
    let writer;

    const btnConnect = document.getElementById('btn-connect');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('status-text');
    const clienteInfo = document.getElementById('cliente-info');
    const modoInfo = document.getElementById('modo-info');
    const controls = document.getElementById('controls');
    const keypadContainer = document.getElementById('keypad-container');

    function log(msg) {
        terminal.innerHTML += `<div>${msg}</div>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    async function sendCmd(char) {
        if (!writer) return;
        const data = new TextEncoder().encode(char);
        await writer.write(data);
    }

    document.getElementById('btn-abrir').addEventListener('click', () => sendCmd('A'));
    document.getElementById('btn-cerrar').addEventListener('click', () => sendCmd('C'));
    
    document.querySelectorAll('.key').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const val = e.target.getAttribute('data-val');
            if (val) sendCmd(val);
        });
    });
    document.getElementById('btn-borrar').addEventListener('click', () => sendCmd('C'));
    document.getElementById('btn-enviar').addEventListener('click', () => sendCmd('D'));

    function processSerialLine(line) {
        if(line.includes("[INICIO]")) {
            statusText.style.display = 'block';
            controls.style.display = 'block';
            keypadContainer.style.display = 'none';
            statusText.innerText = "Sistema Listo";
            statusText.style.color = "#333";
            
            if (line.includes("Cliente:")) {
                let partesCliente = line.split("Cliente: ")[1].split(" | ")[0];
                clienteInfo.innerText = "UNIDAD: " + partesCliente;
            }

            if (line.includes("Modo:")) {
                let modoActual = line.split("Modo: ")[1].trim();
                modoInfo.innerText = "MODO: " + modoActual;
                modoInfo.style.display = 'inline-block';
                modoInfo.style.background = (modoActual === "CHAPA") ? "#d4edda" : "#cce5ff";
                modoInfo.style.color = (modoActual === "CHAPA") ? "#155724" : "#004085";
            }
        }

        if (line.includes("[CLAVE]")) {
            const clave = line.split("]")[1].trim();
            statusText.innerText = `Clave Generada: ${clave}`;
            controls.style.display = 'none';
            setTimeout(() => sendCmd('B'), 500); 
        }

        if (line.includes("[INPUT_OTP]")) {
            statusText.innerText = "Ingrese Clave Dinámica (OTP)";
            keypadContainer.style.display = 'grid';
        }

        if (line.includes("[INPUT]")) {
            const pass = line.split("]")[1].trim();
            statusText.innerText = `OTP: ${pass}`;
        }

        if (line.includes("[EXITO]")) {
            statusText.style.color = "#28a745";
            statusText.innerText = line.split("]")[1].trim();
            keypadContainer.style.display = 'none';
        }
        
        if (line.includes("[ERROR") || line.includes("[BLOQUEO]")) {
            statusText.style.color = "#dc3545";
            statusText.innerText = line.split("]")[1].trim();
        }
    }

    btnConnect.addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 2400 });
            
            // TRUCO DE IGNICIÓN: Apaga y prende la señal DTR para obligar a la placa a reiniciarse y saludar
            try {
                await port.setSignals({ dataTerminalReady: false });
                await new Promise(r => setTimeout(r, 150));
                await port.setSignals({ dataTerminalReady: true });
            } catch(e) {
                log("Aviso: Señales DTR no soportadas en este dispositivo.");
            }

            writer = port.writable.getWriter();
            const decoder = new TextDecoderStream();
            const inputDone = port.readable.pipeTo(decoder.writable);
            const inputStream = decoder.readable;
            const reader = inputStream.getReader();

            btnConnect.style.display = 'none';
            statusText.style.display = 'block';
            log("Conectado. Forzando reinicio de unidad...");

            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) { reader.releaseLock(); break; }
                if (value) {
                    // IMPRIMIR DATOS CRUDOS (En gris) PARA DIAGNOSTICO
                    log("<span style='color:#888;'>[RECIBIENDO]: " + value.replace(/\n/g, '\\n').replace(/\r/g, '\\r') + "</span>");
                    
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    for (let line of lines) {
                        if(line.trim() !== "") {
                            log("> " + line.trim());
                            processSerialLine(line.trim());
                        }
                    }
                }
            }
        } catch (err) {
            log("Error de conexión: " + err);
        }
    });
</script>

</body>
</html>
