<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segumafra - Control USB</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; }
        
        #logo-container { margin-bottom: 10px; }
        #logo-container img { max-width: 160px; margin-bottom: 5px; }
        #welcome-text { font-size: 1.4em; font-weight: bold; color: #0056b3; margin-bottom: 2px; }
        #cliente-info { font-size: 0.9em; color: #444; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-top: 5px; }
        #modo-info { display: inline-block; background: #e9ecef; color: #333; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; margin-top: 8px; letter-spacing: 0.5px; }
        
        .btn-connect { display: inline-block; width: 100%; padding: 16px; margin: 15px 0; font-size: 16px; font-weight: bold; color: white; background: #0056b3; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-connect:active { background: #004494; }
        
        #status-text { font-weight: 600; font-size: 1.1em; margin: 10px 0; color: #333; min-height: 24px; }
        
        /* Caja de la Clave Dinámica */
        #clave-display { display: none; background: #fff4f4; border: 2px solid #d32f2f; color: #d32f2f; font-size: 1.8em; font-weight: bold; padding: 15px; border-radius: 8px; margin: 15px 0; letter-spacing: 2px; }
        #clave-label { font-size: 0.4em; color: #555; display: block; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }

        /* Teclado Matricial 4x4 */
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; display: none; background: #222; padding: 12px; border-radius: 10px; }
        .keypad button { padding: 18px 0; font-size: 20px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: white; transition: 0.1s; }
        .keypad button:active { transform: scale(0.95); }
        
        .key-num { background: #1976d2; } 
        .key-num:active { background: #1565c0; }
        .key-alpha { background: #d32f2f; } 
        .key-alpha:active { background: #b71c1c; }
        .key-sym { background: #f57c00; } 
        .key-sym:active { background: #e65100; }
        
        /* Consola de diagnóstico (Oculta por defecto) */
        #terminal { display: none; background: #1e1e1e; color: #00ff00; padding: 12px; height: 140px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 11px; margin-top: 20px; border-radius: 8px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div id="logo-container">
       <img id="client-logo" src="logo_segumafra.jpg" alt="Segumafra Logo">
        <div id="welcome-text">¡Bienvenido!</div>
        <div id="cliente-info">Sistemas de Alta Tecnología</div>
        <div id="modo-info" style="display:none;">MODO: --</div>
    </div>

    <button id="btn-connect" class="btn-connect">🔌 Conectar Dispositivo USB</button>

    <div id="status-text" style="display:none;">Sincronizando...</div>

    <!-- Módulo visible para dictar clave a monitoreo -->
    <div id="clave-display">
        <span id="clave-label">Clave para Monitoreo:</span>
        <span id="clave-valor">----</span>
    </div>

    <!-- Teclado Matricial 4x4 -->
    <div id="keypad-container" class="keypad">
        <button class="key key-num" data-val="1">1</button>
        <button class="key key-num" data-val="2">2</button>
        <button class="key key-num" data-val="3">3</button>
        <button class="key key-alpha" data-val="A">A</button>
        
        <button class="key key-num" data-val="4">4</button>
        <button class="key key-num" data-val="5">5</button>
        <button class="key key-num" data-val="6">6</button>
        <button class="key key-alpha" data-val="B">B</button>
        
        <button class="key key-num" data-val="7">7</button>
        <button class="key key-num" data-val="8">8</button>
        <button class="key key-num" data-val="9">9</button>
        <button class="key key-alpha" data-val="C">C</button>
        
        <button class="key key-sym" data-val="*">*</button>
        <button class="key key-num" data-val="0">0</button>
        <button class="key key-sym" data-val="#">#</button>
        <button class="key key-alpha" data-val="D">D</button>
    </div>

    <!-- Consola dinámica (aparece solo en modo técnico) -->
    <div id="terminal"></div>
</div>

<script>
    let port;
    let writer;

    const btnConnect = document.getElementById('btn-connect');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('status-text');
    const clienteInfo = document.getElementById('cliente-info');
    const modoInfo = document.getElementById('modo-info');
    const keypadContainer = document.getElementById('keypad-container');
    const claveDisplay = document.getElementById('clave-display');
    const claveValor = document.getElementById('clave-valor');

    function log(msg) {
        terminal.innerHTML += `<div>${msg}</div>`;
        terminal.scrollTop = terminal.scrollHeight;
    }

    async function sendCmd(char) {
        if (!writer) return;
        const data = new TextEncoder().encode(char);
        await writer.write(data);
    }
    
    document.querySelectorAll('.key').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const val = e.target.getAttribute('data-val');
            if (val) sendCmd(val);
        });
    });

    function processSerialLine(line) {
        // 1. Arranque de sistema
        if(line.includes("[INICIO]")) {
            statusText.style.display = 'block';
            keypadContainer.style.display = 'grid'; 
            claveDisplay.style.display = 'none'; 
            terminal.style.display = 'none'; // Ocultar terminal si se reinicia al menú principal
            statusText.innerText = "Sistema Listo. Ingrese comando.";
            statusText.style.color = "#333";
            
            if (line.includes("Cliente:")) {
                let partesCliente = line.split("Cliente: ")[1].split(" | ")[0];
                clienteInfo.innerText = "UNIDAD: " + partesCliente;
            }
            if (line.includes("Modo:")) {
                let modoActual = line.split("Modo: ")[1].trim();
                modoInfo.innerText = "MODO: " + modoActual;
                modoInfo.style.display = 'inline-block';
            }
        }

        // 2. Recepción de la Clave para Monitoreo
        if (line.includes("[CLAVE]")) {
            const clave = line.split("]")[1].trim();
            claveValor.innerText = clave;
            claveDisplay.style.display = 'block'; 
            statusText.innerText = "Clave generada. Ingrese OTP.";
            setTimeout(() => sendCmd('B'), 500); 
        }

        // 3. Captura de OTP
        if (line.includes("[INPUT_OTP]")) {
            statusText.innerText = "Ingrese Clave Dinámica (OTP) y presione D";
        }

        if (line.includes("[INPUT]")) {
            const pass = line.split("]")[1].trim();
            statusText.innerText = `Ingresando: ${pass}`;
        }

        // 4. Modo Técnico / Diagnóstico detectado -> Mostrar Terminal automáticamente
        if (line.includes("[DIAG]") || line.includes("--- MODO TECNICO") || line.includes("[CLAVE_DIAG]")) {
            terminal.style.display = 'block'; // Mostrar la consola de configuración
            statusText.innerText = "Modo Técnico Activo";
        }

        // 5. Resultados
        if (line.includes("[EXITO]")) {
            statusText.style.color = "#28a745";
            statusText.innerText = line.split("]")[1].trim();
        }
        
        if (line.includes("[ERROR") || line.includes("[BLOQUEO]")) {
            statusText.style.color = "#dc3545";
            statusText.innerText = line.split("]")[1].trim();
        }
    }

    btnConnect.addEventListener('click', async () => {
        try {
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 2400 });
            
            try {
                await port.setSignals({ dataTerminalReady: false });
                await new Promise(r => setTimeout(r, 150));
                await port.setSignals({ dataTerminalReady: true });
            } catch(e) {}

            writer = port.writable.getWriter();
            const decoder = new TextDecoderStream();
            const inputDone = port.readable.pipeTo(decoder.writable);
            const inputStream = decoder.readable;
            const reader = inputStream.getReader();

            btnConnect.style.display = 'none';
            statusText.style.display = 'block';
            log("Conectado. Leyendo...");

            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) { reader.releaseLock(); break; }
                if (value) {
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    for (let line of lines) {
                        if(line.trim() !== "") {
                            log("> " + line.trim());
                            processSerialLine(line.trim());
                        }
                    }
                }
            }
        } catch (err) {
            log("Error: " + err);
        }
    });
</script>

</body>
</html>
